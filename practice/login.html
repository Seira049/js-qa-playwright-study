<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Shop – Sign in</title>
  <link rel="stylesheet" href="practice.css" />
</head>
<body>
  <!-- Practice page for the book's Playwright chapters.
       Valid login: qa@test.io / correct-password -->
  <main class="card">
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <label class="inline"><input type="checkbox" id="remember" /> Remember me</label>

      <p class="error" role="alert" hidden></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const error = form.querySelector(".error");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;
      error.hidden = true;
      if (!email || !password) {
        error.textContent = "Email and password are required";
        error.hidden = false;
        return;
      }
      // Simulate a short server round trip so auto-waiting matters.
      setTimeout(() => {
        if (email === "qa@test.io" && password === "correct-password") {
          localStorage.setItem("practice-user", email);
          location.href = "dashboard.html";
        } else {
          error.textContent = "Invalid email or password";
          error.hidden = false;
        }
      }, 300);
    });
  </script>
</body>
</html>
